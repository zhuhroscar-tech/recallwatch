[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recallwatch"
version = "0.1.2"
description = "Segmented recall drift monitor for approximate-nearest-neighbor indexes: catch tail-query recall collapse before users do"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oscar Zhu" }]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
recallwatch = "recallwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
