name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -v
      - name: Smoke-test installed console script on this real Linux runner
        run: |
          recallwatch --version
          recallwatch snapshot --n-items 500 --n-queries 50 --dim 8 --seed 0 --out /tmp/base.json --json
          recallwatch snapshot --n-items 500 --n-queries 50 --dim 8 --seed 0 --n-bits 20 --out /tmp/degraded.json
          set +e
          recallwatch diff /tmp/base.json /tmp/degraded.json
          diff_code=$?
          set -e
          # Coarsening from n-bits default (12) to 20 on a small fixed corpus
          # must trigger a real, measured recall regression -- this is a
          # behavioral smoke test, not just an exit-code check.
          test "$diff_code" -eq 1

  build-artifact:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Smoke-test the built wheel on this Linux runner
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/*.whl
          /tmp/smoke-venv/bin/recallwatch --version
          /tmp/smoke-venv/bin/recallwatch snapshot --n-items 200 --n-queries 20 --dim 6 --seed 0 --out /tmp/wheel_report.json
          python3 -m json.tool /tmp/wheel_report.json > /dev/null
          set +e
          /tmp/smoke-venv/bin/recallwatch --bogus-flag-xyz > /dev/null 2>&1
          bogus_code=$?
          set -e
          test "$bogus_code" -ne 0
      - name: Compute checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
